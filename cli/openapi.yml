                                userNotFound:
                                    $ref: '#/components/examples/ErrorUserNotFound'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
                "401":
                    content:
                        application/json:
                            examples:
                                notAuthorized:
                                    $ref: '#/components/examples/ErrorNotAuthorized'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
                "403":
                    content:
                        application/json:
                            examples:
                                NotInSudoMode:
                                    $ref: '#/components/examples/ErrorNotInSudoMode'
                                notAllowedForApplicationToken:
                                    $ref: '#/components/examples/ErrorNotAllowedForApplicationToken'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
                "503":
                    content:
                        application/json:
                            examples:
                                internalServerError:
                                    $ref: '#/components/examples/ErrorInternalServerError'
                            schema:
