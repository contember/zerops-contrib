        ErrorUnableToDeleteYourOwnAccount:
            value:
                code: unableToDeleteYourOwnAccount
                message: Unable to delete your own account.
        ErrorUserAccountNotFound:
            value:
                code: userAccountNotFound
                message: User account not found
        ErrorUserAlreadyConnectedToCompany:
            value:
                code: userAlreadyConnectedToCompany
                message: User with same e-mail is already connected to this company
        ErrorUserDataNotFound:
            value:
                code: userDataNotFound
                message: Service environment variable not found.
        ErrorUserNotFound:
            value:
                code: userNotFound
                message: User not found.
    parameters:
        Sync:
            in: header
            name: Sync
            schema:
                nullable: true
                type: boolean
        XGitHubEvent:
            in: header
            name: X-Github-Event
            required: true
            schema:
                type: string
        XGitlabEvent:
            in: header
            name: X-Gitlab-Event
            required: true
            schema:
                type: string
        XGitlabToken:
            in: header
            name: X-Gitlab-Token
            required: true
            schema:
                type: string
        XHubSignature:
            in: header
            name: X-Hub-Signature
            required: true
            schema:
                type: string
        action:
            in: query
            name: action
            required: true
            schema:
                type: string
        actionNameContains:
            in: query
            name: actionNameContains
            schema:
                nullable: true
                type: string
        base64PublicKey:
            in: path
            name: base64PublicKey
            required: true
            schema:
                type: string
        branch:
            in: query
            name: branch
            schema:
                default: main
                type: string
        code:
            in: path
            name: code
            required: true
            schema:
                type: string
        date:
            in: path
            name: date
            required: true
            schema:
                pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
                type: string
        delegationId:
            in: path
            name: delegationId
            required: true
            schema:
                format: UUIDShort
                pattern: ^[a-zA-Z0-9]{22}$
                type: string
        domain:
            in: path
            name: domain
            required: true
            schema:
                type: string
        email:
            in: query
            name: email
            schema:
                nullable: true
                type: string
        force:
            description: If user has any existing application tokens, delete will fail. Setting force to true will delete these tokens as well.
            in: query
            name: force
            schema:
                default: false
                description: If user has any existing application tokens, delete will fail. Setting force to true will delete these tokens as well.
                type: boolean
        haRecipe:
            in: query
            name: haRecipe
            schema:
                nullable: true
                type: string
        hasBuild:
            description: Filters app versions by whether they were produced by a build (build.serviceStackId is set).
            in: query
            name: hasBuild
            schema:
                description: Filters app versions by whether they were produced by a build (build.serviceStackId is set).
                nullable: true
                type: boolean
        id:
            in: path
            name: id
            required: true
            schema:
                format: UUIDShort
                pattern: ^[a-zA-Z0-9]{22}$
                type: string
        instanceId:
            in: query
            name: instanceId
            schema:
                format: UUIDShort
                nullable: true
                pattern: ^[a-zA-Z0-9]{22}$
                type: string
        invalidate:
            in: query
            name: invalidate
            schema:
                nullable: true
                type: string
        isSystem:
            in: query
            name: isSystem
            schema:
                nullable: true
                type: boolean
        keyContains:
            in: query
            name: keyContains
            schema:
                nullable: true
                type: string
        limit:
            in: query
            name: limit
            schema:
                format: int
                nullable: true
                type: integer
        name:
            in: path
            name: name
            required: true
            schema:
                type: string
        nameContains:
            in: query
            name: nameContains
            schema:
                nullable: true
                type: string
        nonHaRecipe:
            in: query
            name: nonHaRecipe
            schema:
                nullable: true
                type: string
        offset:
            in: query
            name: offset
            schema:
                format: int
                nullable: true
                type: integer
        overrideEnvIsolation:
            description: Replaces the project-level envIsolation for this preview. Accepts the same values as envIsolation. An empty value or no keeps the stored setting.
            in: query
            name: overrideEnvIsolation
            schema:
                default: "no"
                description: Replaces the project-level envIsolation for this preview. Accepts the same values as envIsolation. An empty value or no keeps the stored setting.
                type: string
        path:
            in: path
            name: path
            required: true
            schema:
                type: string
        preview:
            in: query
            name: preview
            schema:
                nullable: true
                type: boolean
        projectId:
            in: path
            name: projectId
            required: true
            schema:
                format: UUIDShort
                pattern: ^[a-zA-Z0-9]{22}$
                type: string
        redirectUrl:
            in: query
            name: redirectUrl
            required: true
            schema:
                type: string
        repositoryFullName:
            in: query
            name: repositoryFullName
            required: true
            schema:
                type: string
        requestId:
            in: path
            name: requestId
            required: true
            schema:
                format: UUIDShort
                pattern: ^[a-zA-Z0-9]{22}$
                type: string
        reveal:
            in: query
            name: reveal
            schema:
                default: false
                type: boolean
        sensitive:
            in: query
            name: sensitive
            schema:
                default: false
                type: boolean
        serviceStackId:
            in: query
            name: serviceStackId
            schema:
                nullable: true
                type: string
        serviceStackTypeVersionId:
            description: Deprecated. Replaced by `base` field
            in: path
            name: serviceStackTypeVersionId
            required: true
            schema:
                deprecated: true
                description: Deprecated. Replaced by `base` field
                format: id
                type: string
        sort:
            description: 'Fields to sort by: created, sequence. Prefix a field with ''-'' for descending order.'
            in: query
            name: sort
            schema:
                description: 'Fields to sort by: created, sequence. Prefix a field with ''-'' for descending order.'
                format: stringArray
                items:
                    type: string
                nullable: true
                type: array
        stackTypeId:
            in: path
            name: stackTypeId
            required: true
            schema:
                format: id
                type: string
        statuses:
            in: query
            name: statuses
            schema:
                format: stringArray
                items:
                    type: string
                nullable: true
                type: array
        token:
            in: path
            name: token
            required: true
            schema:
                format: UUIDShort
                pattern: ^[a-zA-Z0-9]{22}$
                type: string
        tokenId:
            in: path
            name: tokenId
            required: true
            schema:
                format: UUIDShort
                pattern: ^[a-zA-Z0-9]{22}$
                type: string
        types:
            in: query
            name: types
            schema:
                format: stringArray
                items:
                    type: string
                nullable: true
                type: array
        url:
            in: query
            name: url
            required: true
            schema:
                type: string
        userOnly:
            in: query
            name: userOnly
            schema:
                default: false
                type: boolean
    schemas:
        BaseAppVersionBuild:
            properties:
                cacheSnapshotId:
                    format: UUIDShort
                    nullable: true
                    pattern: ^[a-zA-Z0-9]{22}$
                    type: string
                containerCreationStart:
                    format: dateTime
                    nullable: true
                    type: string
                endDate:
                    format: dateTime
                    nullable: true
                    type: string
                pipelineFailed:
                    format: dateTime
                    nullable: true
                    type: string
                pipelineFinish:
                    format: dateTime
                    nullable: true
                    type: string
                pipelineStart:
                    format: dateTime
                    nullable: true
                    type: string
                serviceStackId:
                    description: = stack.id in Zerops Infrastructure
                    format: UUIDShort
                    nullable: true
                    pattern: ^[a-zA-Z0-9]{22}$
                    type: string
                serviceStackName:
                    nullable: true
                    type: string
                serviceStackTypeVersionId:
                    format: id
                    nullable: true
                    type: string
                serviceStackTypeVersionName:
                    description: Full identifier of the service stack version. Format `os/software@version` or `software:mode@version`
                    example: ubuntu/bun@1.4
                    nullable: true
                    pattern: ^([a-z]+\/)?[a-z-]+(\:[a-z]+)?(@[a-z0-9.]+)?$
                    type: string
                startDate:
                    format: dateTime
                    nullable: true
                    type: string
            type: object
        BaseAppVersionGithubIntegration:
            properties:
                branchName:
                    nullable: true
                    type: string
                commit:
                    type: string
                eventType:
                    enum:
                        - BRANCH
                        - TAG
                    type: string
                pusher:
                    type: string
                repositoryFullName:
                    type: string
                tagName:
                    nullable: true
                    type: string
                tagRegex:
                    nullable: true
                    type: string
                zeropsYamlSetup:
                    nullable: true
                    type: string
            required:
                - eventType
                - pusher
                - commit
                - repositoryFullName
            type: object
        BaseAppVersionGitlabIntegration:
            properties:
                branchName:
                    nullable: true
                    type: string
                commit:
                    type: string
                eventType:
                    enum:
                        - BRANCH
                        - TAG
                    type: string
                pusher:
                    type: string
                repositoryFullName:
                    type: string
                tagName:
                    nullable: true
                    type: string
                tagRegex:
                    nullable: true
                    type: string
                zeropsYamlSetup:
                    nullable: true
                    type: string
            required:
                - eventType
                - pusher
                - commit
                - repositoryFullName
            type: object
        BaseAppVersionJsonObject:
            properties:
                activationDate:
                    format: dateTime
                    nullable: true
                    type: string
                base:
                    description: Full identifier of the service stack version. Format `os/software@version` or `software:mode@version`
                    example: ubuntu/bun@1.4
                    nullable: true
                    pattern: ^([a-z]+\/)?[a-z-]+(\:[a-z]+)?(@[a-z0-9.]+)?$
                    type: string
                build:
                    $ref: '#/components/schemas/BaseAppVersionBuild'
                configContent:
                    format: text
                    nullable: true
                    type: string
                created:
                    format: dateTime
                    nullable: true
                    type: string
                createdByUser:
                    $ref: '#/components/schemas/BaseUserJsonObject'
                githubIntegration:
                    $ref: '#/components/schemas/BaseAppVersionGithubIntegration'
                gitlabIntegration:
                    $ref: '#/components/schemas/BaseAppVersionGitlabIntegration'
                id:
                    format: UUIDShort
                    pattern: ^[a-zA-Z0-9]{22}$
                    type: string
                name:
                    nullable: true
                    type: string
                os:
                    deprecated: true
                    nullable: true
                    type: string
                prepareCustomRuntime:
                    $ref: '#/components/schemas/BasePrepareCustomRuntime'
                projectId:
                    format: UUIDShort
                    nullable: true
                    pattern: ^[a-zA-Z0-9]{22}$
                    type: string
                publicGitSource:
                    $ref: '#/components/schemas/BaseAppVersionPublicGitSource'
                sequence:
                    format: int
                    type: integer
                serviceStackId:
                    description: = stack.id in Zerops Infrastructure
                    format: UUIDShort
                    nullable: true
                    pattern: ^[a-zA-Z0-9]{22}$
                    type: string
                source:
                    default: CLI
                    enum:
                        - CLI
                        - GUI
                        - GITHUB
                        - GITLAB
                        - GIT
                        - NONE
                    type: string
                status:
                    default: UPLOADING
                    enum:
                        - UPLOADING
                        - WAITING_TO_DEPLOY
                        - DEPLOYING
                        - DEPLOY_FAILED
                        - ACTIVE
                        - BACKUP
                        - BUILDING
                        - WAITING_TO_BUILD
                        - BUILD_FAILED
                        - PREPARING_RUNTIME
                        - PREPARING_RUNTIME_FAILED
                        - BUILD_VALIDATION_FAILED
                        - CANCELLED
                    nullable: true
                    type: string
                zeropsYamlJson:
                    format: text
                    nullable: true
                    type: string
            required:
                - id
                - source
                - sequence
            type: object
        BaseAppVersionPublicGitSource:
            properties:
                branchName:
                    type: string
                configContentFromImport:
                    type: boolean
                explicitSetup:
                    nullable: true
                    type: boolean
                gitUrl:
                    type: string
            required:
                - gitUrl
                - branchName
                - configContentFromImport
            type: object
        BaseAppVersionUserData:
            properties:
                content:
                    description: maximálně 8192 znaků, pouze ASCII znaky bez CR a LF
                    example: a=1
                    format: text
                    type: string
                editable:
                    type: boolean
                internal:
                    type: boolean
                key:
                    description: "Musí splňovat regulár [a-zA-Z_]+[a-zA-Z0-9_]* \n\t\t\tJinak stejné požadavky, jako jsou na pole NAME v doménovém záznamu\t\t\t\n\n\t\t\tif ( domainName NOT ENDS WITH \".\" ? ) then (yes)\n\t\t\t   : domainName = inputDomainName || \".\";\n\t\t\tendif;\n\t\t\t\n\t\t\tif ( domainRecord.name CONTAINS \"..\" ? ) then ( yes )\n\t\t\t   : EXCEPTION 400;\n\t\t\t   stop;\n\t\t\tendif;\n\t\t\t\n\t\t\tif ( length(domainRecord.name > 255)\n\t\t\t   : EXCEPTION 400;\n\t\t\t   stop;\n\t\t\tendif;\n\t\t\t\n\t\t\tif ( length(BETWEEN \".\" AND \".\" domainRecord.name > 63)\n\t\t\t   : EXCEPTION 400;\n\t\t\t   stop;\n\t\t\tendif;"
                    example: server1
                    type: string
                sensitive:
                    type: boolean
                type:
                    default: USER
                    description: Odfiltrovat záznamy userData.type == INTERNAL na výstupu /search
                    enum:
                        - READ_ONLY
                        - EDITABLE
                        - SECRET
                        - INTERNAL
                        - ENV
                        - USER
                        - SYSTEM
                    type: string
            required:
                - key
                - content
                - type
                - sensitive
                - internal
                - editable
            type: object
        BaseAutoTopUp:
            properties:
                amount:
                    format: decimal
                    type: string
                calendarMonthlyLimit:
                    format: decimal
                    type: string
                threshold:
                    format: decimal
                    type: string
            required:
                - threshold
                - amount
                - calendarMonthlyLimit
            type: object
        BaseClientAvatar:
            properties:
                externalAvatarUrl:
                    nullable: true
                    type: string
                largeAvatarUrl:
                    nullable: true
                    type: string
                smallAvatarUrl:
                    nullable: true
                    type: string
            type: object
        BaseCustomAutoscaling:
            properties:
                horizontalAutoscalingNullable:
                    $ref: '#/components/schemas/BaseHorizontalAutoscalingNullable'
                verticalAutoscalingNullable:
                    $ref: '#/components/schemas/BaseVerticalAutoscalingNullable'
            type: object
        BaseDomainCertificateInfo:
            properties:
                domainList:
                    format: stringArray
                    items:
                        type: string
                    type: array
                registeredDomain:
                    type: string
                validFrom:
                    format: dateTime
                    nullable: true
                    type: string
                validTill:
                    format: dateTime
                    nullable: true
                    type: string
            required:
                - registeredDomain
                - domainList
            type: object
        BaseDomainDnsCheckChallenge:
            properties:
                challengeHost:
                    type: string
                challengeUrl:
                    type: string
                error:
                    format: text
                    nullable: true
                    type: string
                httpResponse:
                    format: text
                    nullable: true
                    type: string
                httpStatusCode:
                    format: int
                    nullable: true
                    type: integer
            required:
                - challengeUrl
                - challengeHost
            type: object
        BaseDomainDnsCheckDetail:
            properties:
                challenges:
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseDomainDnsCheckChallenge'
                    type: array
                resolvedIpAddresses:
                    format: stringArray
                    items:
                        type: string
                    type: array
                resolvedNameServers:
                    format: stringArray
                    items:
                        type: string
                    type: array
                wildcardCnameCheckError:
                    format: text
                    nullable: true
                    type: string
            required:
                - resolvedNameServers
                - resolvedIpAddresses
                - challenges
            type: object
        BaseErrorObject:
