    title: ZeropsBusiness-restPublic
    version: 70762414c97ef32c2932f73459a1fa45
openapi: 3.0.0
paths:
    /api/rest/public/2fa/credentials/{id}:
        delete:
            description: |-
                Delete specified WebAuthn credential

                Disallowed access for following token types: `personal`, `integration`
            operationId: delete2FACredential
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResponseAuth'
                    description: Success response
                "400":
                    content:
                        application/json:
                            examples:
                                userNotFound:
                                    $ref: '#/components/examples/ErrorUserNotFound'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
                "401":
                    content:
                        application/json:
                            examples:
                                notAuthorized:
                                    $ref: '#/components/examples/ErrorNotAuthorized'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
                "403":
                    content:
                        application/json:
                            examples:
                                NotInSudoMode:
                                    $ref: '#/components/examples/ErrorNotInSudoMode'
                                notAllowedForApplicationToken:
                                    $ref: '#/components/examples/ErrorNotAllowedForApplicationToken'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
                "503":
                    content:
                        application/json:
                            examples:
                                internalServerError:
                                    $ref: '#/components/examples/ErrorInternalServerError'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
            security:
                - httpAuthorizationHeaderBearer: []
            tags:
                - PublicAuth
    /api/rest/public/2fa/credentials/list:
        get:
            description: List all registered WebAuthn credentials
            operationId: list2FACredentials
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResponseWebAuthnCredentialList'
                    description: Success response
                "401":
                    content:
                        application/json:
                            examples:
                                notAuthorized:
                                    $ref: '#/components/examples/ErrorNotAuthorized'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
                "503":
                    content:
                        application/json:
                            examples:
                                internalServerError:
                                    $ref: '#/components/examples/ErrorInternalServerError'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
            security:
                - httpAuthorizationHeaderBearer: []
            tags:
                - PublicAuth
    /api/rest/public/2fa/login/finish:
        post:
            description: Finish FIDO2 2FA login ceremony
            operationId: 2FAFido2LoginCeremonyFinish
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RequestWebAuthnLoginVerification'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResponseAuthLogin'
                    description: Success response
                "400":
                    content:
                        application/json:
                            examples:
                                TwoFactorAuthSessionNotFound:
                                    $ref: '#/components/examples/ErrorTwoFactorAuthSessionNotFound'
                                userNotFound:
                                    $ref: '#/components/examples/ErrorUserNotFound'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
                "401":
                    content:
                        application/json:
                            examples:
                                notAuthorized:
                                    $ref: '#/components/examples/ErrorNotAuthorized'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
                "503":
                    content:
                        application/json:
                            examples:
                                internalServerError:
                                    $ref: '#/components/examples/ErrorInternalServerError'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
            security:
                - httpAuthorizationHeaderBearer: []
            tags:
                - PublicAuth
    /api/rest/public/2fa/login/start:
        post:
            description: Begin FIDO2 2FA login ceremony
            operationId: 2FAFido2LoginCeremonyStart
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResponseWebAuthnOptions'
                    description: Success response
                "400":
                    content:
                        application/json:
                            examples:
                                userNotFound:
                                    $ref: '#/components/examples/ErrorUserNotFound'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
                "401":
                    content:
                        application/json:
                            examples:
                                notAuthorized:
                                    $ref: '#/components/examples/ErrorNotAuthorized'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
                "503":
                    content:
                        application/json:
                            examples:
                                internalServerError:
                                    $ref: '#/components/examples/ErrorInternalServerError'
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Error response
            security:
                - httpAuthorizationHeaderBearer: []
            tags:
                - PublicAuth
    /api/rest/public/2fa/recovery-codes:
        get:
            description: |-
                Show current 2FA recovery codes

                Disallowed access for following token types: `personal`, `integration`
            operationId: show2FARecoveryCodes
            responses:
                "200":
