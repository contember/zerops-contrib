info:
    title: ZeropsBusiness-restPublic
    description: |-
        ## Specification for the Zerops API v0-beta

        #### Warning
        This API is currently in beta. Breaking changes may occur at any time without prior notice. The API will be considered stable upon the v1 release.
    contact:
        email: dev@zerops.io
    license:
        name: Zerops client licence
        url: https://www.zerops.io
    version: cf702150fcb82509106c2f45636eae93
paths:
    /api/rest/public/2fa/credentials/{id}:
        delete:
            tags:
                - PublicAuth
            description: |-
                Delete specified WebAuthn credential

                Disallowed access for following token types: `personal`, `integration`
            operationId: delete2FACredential
            parameters:
                - $ref: '#/components/parameters/id'
            responses:
                "200":
                    description: Success response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResponseAuth'
                "400":
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                userNotFound:
                                    $ref: '#/components/examples/ErrorUserNotFound'
                "401":
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                notAuthorized:
                                    $ref: '#/components/examples/ErrorNotAuthorized'
                "403":
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                NotInSudoMode:
                                    $ref: '#/components/examples/ErrorNotInSudoMode'
                                notAllowedForApplicationToken:
                                    $ref: '#/components/examples/ErrorNotAllowedForApplicationToken'
                "503":
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                internalServerError:
                                    $ref: '#/components/examples/ErrorInternalServerError'
            security:
                - httpAuthorizationHeaderBearer: []
    /api/rest/public/2fa/credentials/list:
        get:
            tags:
                - PublicAuth
            description: List all registered WebAuthn credentials
            operationId: list2FACredentials
            responses:
                "200":
                    description: Success response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResponseWebAuthnCredentialList'
                "401":
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                notAuthorized:
                                    $ref: '#/components/examples/ErrorNotAuthorized'
                "503":
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                internalServerError:
                                    $ref: '#/components/examples/ErrorInternalServerError'
            security:
                - httpAuthorizationHeaderBearer: []
    /api/rest/public/2fa/login/finish:
        post:
            tags:
                - PublicAuth
            description: Finish FIDO2 2FA login ceremony
            operationId: 2FAFido2LoginCeremonyFinish
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RequestWebAuthnLoginVerification'
            responses:
                "200":
                    description: Success response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResponseAuthLogin'
                "400":
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                TwoFactorAuthSessionNotFound:
                                    $ref: '#/components/examples/ErrorTwoFactorAuthSessionNotFound'
                                userNotFound:
                                    $ref: '#/components/examples/ErrorUserNotFound'
                "401":
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                notAuthorized:
                                    $ref: '#/components/examples/ErrorNotAuthorized'
                "503":
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                internalServerError:
                                    $ref: '#/components/examples/ErrorInternalServerError'
            security:
                - httpAuthorizationHeaderBearer: []
    /api/rest/public/2fa/login/start:
        post:
            tags:
                - PublicAuth
            description: Begin FIDO2 2FA login ceremony
            operationId: 2FAFido2LoginCeremonyStart
            responses:
                "200":
                    description: Success response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResponseWebAuthnOptions'
                "400":
                    description: Error response
                    content:
