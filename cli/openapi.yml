openapi: 3.0.0
components:
    schemas:
        BaseAppVersionBuild:
            type: object
            properties:
                cacheSnapshotId:
                    type: string
                    format: UUIDShort
                    nullable: true
                    pattern: ^[a-zA-Z0-9]{22}$
                containerCreationStart:
                    type: string
                    format: dateTime
                    nullable: true
                endDate:
                    type: string
                    format: dateTime
                    nullable: true
                pipelineFailed:
                    type: string
                    format: dateTime
                    nullable: true
                pipelineFinish:
                    type: string
                    format: dateTime
                    nullable: true
                pipelineStart:
                    type: string
                    format: dateTime
                    nullable: true
                serviceStackId:
                    type: string
                    format: UUIDShort
                    description: = stack.id in Zerops Infrastructure
                    nullable: true
                    pattern: ^[a-zA-Z0-9]{22}$
                serviceStackName:
                    type: string
                    nullable: true
                serviceStackTypeVersionId:
                    type: string
                    format: id
                    nullable: true
                serviceStackTypeVersionName:
                    type: string
                    description: Full identifier of the service stack version. Format `os/software@version` or `software:mode@version`
                    example: ubuntu/bun@1.3.9
                    nullable: true
                    pattern: ^([a-z]+\/)?[a-z-]+(\:[a-z]+)?(@[a-z0-9.]+)?$
                startDate:
                    type: string
                    format: dateTime
                    nullable: true
        BaseAppVersionGithubIntegration:
            type: object
            required:
                - eventType
                - pusher
                - commit
                - repositoryFullName
            properties:
                branchName:
                    type: string
                    nullable: true
                commit:
                    type: string
                eventType:
                    type: string
                    enum:
                        - BRANCH
                        - TAG
                pusher:
                    type: string
                repositoryFullName:
                    type: string
                tagName:
                    type: string
                    nullable: true
                tagRegex:
                    type: string
                    nullable: true
                zeropsYamlSetup:
                    type: string
                    nullable: true
        BaseAppVersionGitlabIntegration:
            type: object
            required:
                - eventType
                - pusher
                - commit
                - repositoryFullName
            properties:
                branchName:
                    type: string
                    nullable: true
                commit:
                    type: string
                eventType:
                    type: string
                    enum:
                        - BRANCH
                        - TAG
                pusher:
                    type: string
                repositoryFullName:
                    type: string
                tagName:
                    type: string
                    nullable: true
                tagRegex:
                    type: string
                    nullable: true
                zeropsYamlSetup:
                    type: string
                    nullable: true
        BaseAppVersionJsonObject:
            type: object
            required:
                - id
                - sequence
            properties:
                activationDate:
                    type: string
                    format: dateTime
                    nullable: true
                base:
                    type: string
                    description: Full identifier of the service stack version. Format `os/software@version` or `software:mode@version`
                    example: ubuntu/bun@1.3.9
                    nullable: true
                    pattern: ^([a-z]+\/)?[a-z-]+(\:[a-z]+)?(@[a-z0-9.]+)?$
                build:
                    $ref: '#/components/schemas/BaseAppVersionBuild'
                configContent:
                    type: string
                    format: text
                    nullable: true
                created:
                    type: string
                    format: dateTime
                    nullable: true
                createdByUser:
                    $ref: '#/components/schemas/BaseUserJsonObject'
                githubIntegration:
                    $ref: '#/components/schemas/BaseAppVersionGithubIntegration'
                gitlabIntegration:
                    $ref: '#/components/schemas/BaseAppVersionGitlabIntegration'
                id:
                    type: string
                    format: UUIDShort
                    pattern: ^[a-zA-Z0-9]{22}$
                name:
                    type: string
                    nullable: true
                os:
                    type: string
                    nullable: true
                    deprecated: true
                prepareCustomRuntime:
                    $ref: '#/components/schemas/BasePrepareCustomRuntime'
                projectId:
                    type: string
                    format: UUIDShort
                    nullable: true
                    pattern: ^[a-zA-Z0-9]{22}$
                publicGitSource:
                    $ref: '#/components/schemas/BaseAppVersionPublicGitSource'
                sequence:
                    type: integer
                    format: int
                serviceStackId:
                    type: string
                    format: UUIDShort
                    description: = stack.id in Zerops Infrastructure
                    nullable: true
                    pattern: ^[a-zA-Z0-9]{22}$
                source:
                    type: string
                    enum:
                        - CLI
                        - GUI
                        - GITHUB
                        - GITLAB
                        - GIT
                        - NONE
                    default: CLI
                status:
                    type: string
                    enum:
                        - UPLOADING
                        - WAITING_TO_DEPLOY
                        - DEPLOYING
                        - DEPLOY_FAILED
                        - ACTIVE
                        - BACKUP
                        - BUILDING
                        - WAITING_TO_BUILD
                        - BUILD_FAILED
                        - PREPARING_RUNTIME
                        - PREPARING_RUNTIME_FAILED
                        - BUILD_VALIDATION_FAILED
                        - CANCELLED
                    default: UPLOADING
                    nullable: true
                zeropsYamlJson:
                    type: string
                    format: text
                    nullable: true
        BaseAppVersionPublicGitSource:
            type: object
            required:
                - gitUrl
                - branchName
                - configContentFromImport
            properties:
                branchName:
                    type: string
                configContentFromImport:
                    type: boolean
                explicitSetup:
                    type: boolean
                    nullable: true
                gitUrl:
                    type: string
        BaseAppVersionUserData:
            type: object
            required:
                - key
                - content
            properties:
                content:
                    type: string
                    format: text
                    description: maximálně 8192 znaků, pouze ASCII znaky bez CR a LF
                    example: a=1
                key:
                    type: string
                    description: "Musí splňovat regulár [a-zA-Z_]+[a-zA-Z0-9_]* \n\t\t\tJinak stejné požadavky, jako jsou na pole NAME v doménovém záznamu\t\t\t\n\n\t\t\tif ( domainName NOT ENDS WITH \".\" ? ) then (yes)\n\t\t\t   : domainName = inputDomainName || \".\";\n\t\t\tendif;\n\t\t\t\n\t\t\tif ( domainRecord.name CONTAINS \"..\" ? ) then ( yes )\n\t\t\t   : EXCEPTION 400;\n\t\t\t   stop;\n\t\t\tendif;\n\t\t\t\n\t\t\tif ( length(domainRecord.name > 255)\n\t\t\t   : EXCEPTION 400;\n\t\t\t   stop;\n\t\t\tendif;\n\t\t\t\n\t\t\tif ( length(BETWEEN \".\" AND \".\" domainRecord.name > 63)\n\t\t\t   : EXCEPTION 400;\n\t\t\t   stop;\n\t\t\tendif;"
                    example: server1
                type:
                    type: string
                    description: Odfiltrovat záznamy userData.type == INTERNAL na výstupu /search
                    enum:
                        - READ_ONLY
                        - EDITABLE
                        - SECRET
                        - INTERNAL
                        - ENV
                    default: SECRET
                    deprecated: true
        BaseAutoTopUp:
            type: object
            required:
                - threshold
                - amount
                - calendarMonthlyLimit
            properties:
                amount:
                    type: number
                    format: decimal
                calendarMonthlyLimit:
                    type: number
                    format: decimal
                threshold:
                    type: number
                    format: decimal
        BaseClientAvatar:
            type: object
            properties:
                externalAvatarUrl:
                    type: string
                    nullable: true
                largeAvatarUrl:
                    type: string
                    nullable: true
                smallAvatarUrl:
                    type: string
                    nullable: true
        BaseCustomAutoscaling:
            type: object
            properties:
                horizontalAutoscalingNullable:
                    $ref: '#/components/schemas/BaseHorizontalAutoscalingNullable'
                verticalAutoscalingNullable:
                    $ref: '#/components/schemas/BaseVerticalAutoscalingNullable'
        BaseDomainCertificateInfo:
            type: object
            required:
                - registeredDomain
                - domainList
            properties:
                domainList:
                    type: array
                    format: stringArray
                    items:
                        type: string
                registeredDomain:
                    type: string
                validFrom:
                    type: string
                    format: dateTime
                    nullable: true
                validTill:
                    type: string
                    format: dateTime
                    nullable: true
        BaseDomainDnsCheckChallenge:
            type: object
            required:
                - challengeUrl
                - challengeHost
            properties:
                challengeHost:
                    type: string
                challengeUrl:
                    type: string
                error:
                    type: string
                    format: text
                    nullable: true
                httpResponse:
                    type: string
                    format: text
                    nullable: true
                httpStatusCode:
                    type: integer
                    format: int
                    nullable: true
        BaseDomainDnsCheckDetail:
            type: object
            required:
                - resolvedNameServers
                - resolvedIpAddresses
                - challenges
            properties:
                challenges:
                    type: array
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseDomainDnsCheckChallenge'
                resolvedIpAddresses:
                    type: array
                    format: stringArray
                    items:
                        type: string
                resolvedNameServers:
                    type: array
                    format: stringArray
                    items:
                        type: string
                wildcardCnameCheckError:
                    type: string
                    format: text
                    nullable: true
        BaseErrorObject:
            type: object
            required:
                - code
                - message
            properties:
                code:
                    type: string
                message:
                    type: string
                meta:
                    type: object
                    format: jsonRawMessage
                    nullable: true
        BaseHardwareResource:
            type: object
            required:
                - cpuCoreCount
                - memoryMBytes
                - diskGBytes
            properties:
                cpuCoreCount:
                    type: integer
                    format: int
                diskGBytes:
                    type: integer
                    format: int
                memoryMBytes:
                    type: integer
                    format: int
        BaseHorizontalAutoscaling:
            type: object
            required:
                - maxContainerCount
                - minContainerCount
            properties:
                maxContainerCount:
                    type: integer
                    format: int
                minContainerCount:
                    type: integer
                    format: int
        BaseHorizontalAutoscalingNullable:
            type: object
            properties:
                maxContainerCount:
                    type: integer
                    format: int
                    nullable: true
                minContainerCount:
                    type: integer
                    format: int
                    nullable: true
        BaseIntegrationTokenDelegationPermission:
            type: object
            required:
                - projectPermissions
            properties:
                canCreateProjects:
                    type: boolean
                    description: |-
                        Only Owner and Admin can set/modify this flag, and it cannot be disabled for these roles.
                        When enabled, the user can create new projects and will automatically receive the Owner role for those projects.
                    default: false
                canEditFinances:
                    type: boolean
                    description: |-
                        Only Owner can set/modify this flag, and it cannot be disabled for this role.
                        When enabled, the user can view and modify financial information for the client. Enabling this flag also enables canViewFinances.
                    default: false
                canViewFinances:
                    type: boolean
                    description: |-
                        Only Owner can set/modify this flag, and it cannot be disabled for this role.
                        When enabled, the user can view financial information for the client.
                    default: false
                projectPermissions:
                    type: array
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseIntegrationTokenDelegationProjectPermission'
                roleCode:
                    type: string
                    description: |-
                        Assigned user role.

                        Roles are tiered, and the higher role has all the permissions of the lower role.
                        Order of roles, from highest to lowest: Owner > Admin > Basic user > Read only > No access.

                        - Owner: Full control over company settings, billing, personnel, and all technical resources. Always has CanCreateProjects, CanViewFinances, and CanEditFinances enabled (cannot be disabled).
                        - Admin: Full control over projects and technical resources, but cannot manage billing or Owner/Admin personnel. Always has CanCreateProjects enabled (cannot be disabled).
                        - Basic user: Can perform standard operations on projects.
                        - Read only: Can view project configurations and logs but cannot modify anything.
                        - No access: Cannot access any resources by default.

                        Project-specific roles override client-level roles. Users with CanCreateProjects enabled can create new projects and automatically receive the Owner role for those projects.
                    enum:
                        - OWNER
                        - ADMIN
                        - BASIC_USER
                        - READ_ONLY
                        - NO_ACCESS
                    default: NO_ACCESS
        BaseIntegrationTokenDelegationProjectPermission:
            type: object
            required:
                - clientId
                - projectId
            properties:
                clientId:
                    type: string
                    format: UUIDShort
                    pattern: ^[a-zA-Z0-9]{22}$
                projectId:
                    type: string
                    format: UUIDShort
                    pattern: ^[a-zA-Z0-9]{22}$
                roleCode:
                    type: string
                    description: |-
                        Assigned user role.

                        Roles are tiered, and the higher role has all the permissions of the lower role.
                        Order of roles, from highest to lowest: Owner > Admin > Basic user > Read only > No access.

                        - Owner: Full control over company settings, billing, personnel, and all technical resources. Always has CanCreateProjects, CanViewFinances, and CanEditFinances enabled (cannot be disabled).
                        - Admin: Full control over projects and technical resources, but cannot manage billing or Owner/Admin personnel. Always has CanCreateProjects enabled (cannot be disabled).
                        - Basic user: Can perform standard operations on projects.
                        - Read only: Can view project configurations and logs but cannot modify anything.
                        - No access: Cannot access any resources by default.

                        Project-specific roles override client-level roles. Users with CanCreateProjects enabled can create new projects and automatically receive the Owner role for those projects.
                    enum:
                        - OWNER
                        - ADMIN
                        - BASIC_USER
                        - READ_ONLY
                        - NO_ACCESS
                    default: NO_ACCESS
        BaseLocationServiceStackInfo:
            type: object
            required:
                - serviceStackName
                - serviceStackTypeName
                - serviceStackTypeVersionName
            properties:
                serviceStackName:
                    type: string
                serviceStackTypeName:
                    type: string
                serviceStackTypeVersionName:
                    type: string
        BasePrepareCustomRuntime:
            type: object
            properties:
                containerCreationStart:
                    type: string
                    format: dateTime
                    nullable: true
                endDate:
                    type: string
                    format: dateTime
                    nullable: true
                reason:
                    type: string
                    nullable: true
                serviceStackId:
                    type: string
                    format: UUIDShort
                    description: = stack.id in Zerops Infrastructure
                    nullable: true
                    pattern: ^[a-zA-Z0-9]{22}$
                serviceStackName:
                    type: string
                    description: |-
                        hostname + ENV
                        		Jako hostname + musí splňovat regulární výraz [a-zA-Z_]+[a-zA-Z0-9_]*
                        		check valid hostname
                        		if ( hostnameENV NOT IN  "[a-zA-Z_]+[a-zA-Z0-9_]*" ? ) then ( yes )
                        			: EXCEPTION 400;
                        			stop;
                        		endif;
                    example: server1
                    nullable: true
                startDate:
                    type: string
                    format: dateTime
                    nullable: true
        BaseProjectLightJsonObject:
            type: object
            required:
                - id
                - clientId
                - name
                - tagList
                - created
                - lastUpdate
            properties:
                clientId:
                    type: string
                    format: UUIDShort
                    pattern: ^[a-zA-Z0-9]{22}$
                created:
                    type: string
                    format: dateTime
                description:
                    type: string
                    format: text
                    nullable: true
                id:
                    type: string
                    format: UUIDShort
                    pattern: ^[a-zA-Z0-9]{22}$
                lastUpdate:
                    type: string
                    format: dateTime
                name:
                    type: string
                recipeSource:
                    type: string
                    format: text
                    nullable: true
                recipeSourceUrl:
                    type: string
                    format: text
                    nullable: true
                status:
                    type: string
                    enum:
                        - NEW
                        - CREATING
                        - ACTIVE
                        - DELETING
                        - FAILED
                        - STOPPING
                        - STOPPED
                        - STARTING
                    default: NEW
                tagList:
                    type: array
                    format: stringArray
                    items:
                        type: string
        BasePrometheusServiceDiscovery:
            type: object
            required:
                - targets
                - labels
            properties:
                labels:
                    type: object
                    format: map
                    description: Labels to add to each target. Both key and value must be strings.
                    example:
                        app: custom-app-label
                        env: dev
                targets:
                    type: array
                    format: stringArray
                    description: 'List of targets to scrape in format: <host>:<port>. Do not include scheme or path, all targets must use `/metrics` path.'
                    example:
                        - example.com
                        - domain.tld:9090
                        - 123.123.123.123:9090
                    items:
                        type: string
        BasePublicHttpRoutingDomain:
            type: object
            required:
                - domainName
            properties:
                beingInstalledSslCertificate:
                    $ref: '#/components/schemas/BaseDomainCertificateInfo'
                cdnStatus:
                    type: string
                    enum:
                        - DISABLED
                        - BEING_INSTALLED
                        - ACTIVE
                        - BEING_DISABLED
                    default: DISABLED
                deployedSslCertificate:
                    $ref: '#/components/schemas/BaseDomainCertificateInfo'
                dnsCheckStatus:
                    type: string
                    enum:
                        - PENDING
                        - CHECKING
                        - OK
                        - FAILED
                    default: PENDING
                domainName:
                    type: string
                lastDnsCheckAt:
                    type: string
                    format: dateTime
                    nullable: true
                lastDnsCheckDetail:
                    $ref: '#/components/schemas/BaseDomainDnsCheckDetail'
                nextDnsCheckAt:
                    type: string
                    format: dateTime
                    nullable: true
                sslCertificateInstallationError:
                    type: string
                    format: mediumText
                    nullable: true
                sslStatus:
                    type: string
                    enum:
                        - INACTIVE
                        - WAITING_FOR_DNS
                        - BEING_INSTALLED
                        - BEING_RENEWED
                        - ACTIVE
                    default: INACTIVE
        BasePublicHttpRoutingLocation:
            type: object
            required:
                - path
                - port
                - serviceStackId
                - serviceStackInfo
            properties:
                config:
                    $ref: '#/components/schemas/BasePublicHttpRoutingLocationConfig'
                path:
                    type: string
                port:
                    type: integer
                    format: int
                serviceStackId:
                    type: string
                    format: UUIDShort
                    description: = stack.id in Zerops Infrastructure
                    pattern: ^[a-zA-Z0-9]{22}$
                serviceStackInfo:
                    $ref: '#/components/schemas/BaseLocationServiceStackInfo'
        BasePublicHttpRoutingLocationAccessPolicy:
            type: object
            required:
                - cidr
            properties:
                cidr:
                    type: array
                    format: stringArray
                    items:
                        type: string
                defaultPolicy:
                    type: string
                    enum:
                        - allow
                        - deny
                    default: allow
                enabled:
                    type: boolean
                    default: false
                realIpHeader:
                    type: string
                    default: X-Forwarded-For
                    nullable: true
                setRealIpFrom:
                    type: array
                    format: stringArray
                    nullable: true
                    items:
                        type: string
        BasePublicHttpRoutingLocationBasicAuth:
            type: object
            required:
                - realm
                - users
            properties:
                enabled:
                    type: boolean
                    default: false
                realm:
                    type: string
                    format: emptyString
                users:
                    type: array
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BasePublicHttpRoutingLocationBasicAuthUser'
        BasePublicHttpRoutingLocationBasicAuthUser:
            type: object
            required:
                - username
                - password
                - comment
            properties:
                comment:
                    type: string
                    format: emptyString
                password:
                    type: string
                    format: emptyString
                username:
                    type: string
                    format: emptyString
        BasePublicHttpRoutingLocationConfig:
            type: object
            properties:
                accessPolicy:
                    $ref: '#/components/schemas/BasePublicHttpRoutingLocationAccessPolicy'
                basicAuth:
                    $ref: '#/components/schemas/BasePublicHttpRoutingLocationBasicAuth'
                content:
                    $ref: '#/components/schemas/BasePublicHttpRoutingLocationContent'
                rateLimiting:
                    $ref: '#/components/schemas/BasePublicHttpRoutingLocationRateLimiting'
                redirect:
                    $ref: '#/components/schemas/BasePublicHttpRoutingLocationRedirect'
        BasePublicHttpRoutingLocationContent:
            type: object
            properties:
                code:
                    type: integer
                    format: int
                    default: 200
                content:
                    type: string
                    format: text
                    default: Hello world!
                contentType:
                    type: string
                    format: emptyString
                    default: application/octet-stream
                enabled:
                    type: boolean
                    default: false
        BasePublicHttpRoutingLocationRateLimiting:
            type: object
            properties:
                burst:
                    type: integer
                    format: int
                    default: 10
                enabled:
                    type: boolean
                    default: false
                key:
                    type: string
                    enum:
                        - binary_remote_addr
                        - server_name
                    default: binary_remote_addr
                rate:
                    type: integer
                    format: int
                    default: 10
                zone:
                    type: string
                    format: emptyString
                    default: mainzone
                zoneSize:
                    type: integer
                    format: int
                    default: 10
        BasePublicHttpRoutingLocationRedirect:
            type: object
            required:
                - to
            properties:
                code:
                    type: integer
                    format: int
                    default: 302
                enabled:
                    type: boolean
                    default: false
                preservePath:
                    type: boolean
                    default: false
                preserveQuery:
                    type: boolean
                    default: false
                to:
                    type: string
                    format: emptyString
        BaseRequestedPortsJsonObject:
            type: object
            required:
                - isActive
                - requestedPorts
            properties:
                isActive:
                    type: boolean
                requestedPorts:
                    type: array
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseServicePort'
        BaseScalingMinFreeResource:
            type: object
            required:
                - cpuCoreCount
                - cpuCorePercent
                - memoryGBytes
                - memoryPercent
            properties:
                cpuCoreCount:
                    type: number
                    format: float
                cpuCorePercent:
                    type: number
                    format: float
                memoryGBytes:
                    type: number
                    format: float
                memoryPercent:
                    type: number
                    format: float
        BaseScalingMinFreeResourceNullable:
            type: object
            properties:
                cpuCoreCount:
                    type: number
                    format: float
                    nullable: true
                cpuCorePercent:
                    type: number
                    format: float
                    nullable: true
                memoryGBytes:
                    type: number
                    format: float
                    nullable: true
                memoryPercent:
                    type: number
                    format: float
                    nullable: true
        BaseScalingResource:
            type: object
            required:
                - cpuCoreCount
                - memoryGBytes
                - diskGBytes
            properties:
                cpuCoreCount:
                    type: integer
                    format: int
                diskGBytes:
                    type: number
                    format: float
                memoryGBytes:
                    type: number
                    format: float
        BaseScalingResourceNullable:
            type: object
            properties:
                cpuCoreCount:
                    type: integer
                    format: int
                    nullable: true
                diskGBytes:
                    type: number
                    format: float
                    nullable: true
                memoryGBytes:
                    type: number
                    format: float
                    nullable: true
        BaseServicePort:
            type: object
            required:
                - port
                - description
                - scheme
            properties:
                description:
                    type: string
                    format: emptyString
                httpRouting:
                    type: boolean
                    default: false
                    nullable: true
                port:
                    type: integer
                    format: int
                portRouting:
                    type: boolean
                    default: false
                    nullable: true
                protocol:
                    type: string
                    enum:
                        - tcp
                        - udp
                    default: tcp
                scheme:
                    type: string
                    enum:
                        - tcp
                        - udp
                        - http
                        - https
                        - redis
                        - mysql
                        - postgresql
                        - nats
                        - clickhouse
                serviceId:
                    type: string
                    format: UUIDShort
                    description: = service.id in Zerops Infrastructure
                    nullable: true
                    pattern: ^[a-zA-Z0-9]{22}$
        BaseServiceStackInfoJsonObject:
            type: object
            required:
                - serviceStackTypeName
                - serviceStackTypeVersionName
            properties:
                serviceStackTypeCategory:
                    type: string
                    enum:
                        - CORE
                        - HTTP_L7_BALANCER
                        - STANDARD
                        - USER
                        - SHARED_STORAGE
                        - OBJECT_STORAGE
                        - BUILD
                        - INTERNAL
                        - PREPARE_RUNTIME
                    default: CORE
                serviceStackTypeName:
                    type: string
                serviceStackTypeVersionName:
                    type: string
        BaseServiceStackLightJsonObject:
            type: object
            required:
                - id
                - created
                - lastUpdate
                - projectId
                - serviceStackTypeId
                - serviceStackTypeVersionId
                - name
                - serviceStackTypeInfo
                - ports
            properties:
                created:
                    type: string
                    format: dateTime
                driverId:
                    type: string
                    format: id
                    nullable: true
                id:
                    type: string
                    format: UUIDShort
                    description: = stack.id in Zerops Infrastructure
                    pattern: ^[a-zA-Z0-9]{22}$
                lastUpdate:
                    type: string
                    format: dateTime
                name:
                    type: string
                    description: |-
                        hostname + ENV
                        		Jako hostname + musí splňovat regulární výraz [a-zA-Z_]+[a-zA-Z0-9_]*
                        		check valid hostname
                        		if ( hostnameENV NOT IN  "[a-zA-Z_]+[a-zA-Z0-9_]*" ? ) then ( yes )
                        			: EXCEPTION 400;
                        			stop;
                        		endif;
                    example: server1
